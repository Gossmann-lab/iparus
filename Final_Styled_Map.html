<html>
<head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --pill:#e2e8f0; --primary:#2563eb; --card:#ffffff; }
  body.dark { --bg:#0f172a; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; --pill:#334155; --card:#1e293b; }
  html, body { height:100%; margin:0; overflow:hidden; }     /* fixed page: the map fills the frame, no scrolling */
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  body > div:not(.pm-bar) { flex:1; min-height:0; }
  .plotly-graph-div { height:100% !important; }
  .plotly .point, .plotly .scatterlayer .trace .points path { cursor:pointer !important; }

  .pm-bar { flex:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px;
            padding:12px 16px; border-bottom:1px solid var(--border); background:var(--card); }
  .pm-group { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pm-label { font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .pm-pills { display:inline-flex; gap:3px; padding:4px; border-radius:30px; background:var(--pill); flex-wrap:wrap; }
  .pm-pill { border:none; background:transparent; color:var(--muted); cursor:pointer; font:inherit; font-size:.78rem; font-weight:700;
             padding:6px 14px; border-radius:25px; transition:background .2s, color .2s, transform .15s; white-space:nowrap; }
  .pm-pill i { font-weight:600; }
  .pm-pill small { opacity:.75; font-weight:600; margin-left:4px; }
  .pm-pill:hover:not(.active) { color:var(--text); }
  .pm-pill.active { background:#dbeafe; color:#1d4ed8; box-shadow:inset 0 0 0 1px rgba(37,99,235,.25); }
  body.dark .pm-pill.active { background:rgba(96,165,250,.22); color:#bfdbfe; box-shadow:inset 0 0 0 1px rgba(147,197,253,.3); }
  .pm-chip { display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--border); background:var(--card); color:var(--text);
             cursor:pointer; font:inherit; font-size:.78rem; font-weight:600; padding:5px 12px; border-radius:25px; transition:all .2s; }
  .pm-chip:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.12); }
  .pm-chip .dot { width:11px; height:11px; border-radius:50%; background:var(--c); box-shadow:0 0 0 2px rgba(255,255,255,.7); }
  .pm-chip small { color:var(--muted); font-weight:600; }
  .pm-chip.off { opacity:.45; }
  .pm-chip.off .dot { background:transparent; box-shadow:inset 0 0 0 2px var(--c); }
  .pm-status { font-size:.78rem; color:var(--muted); }
  .pm-status b { color:var(--text); }
  .pm-hint { font-size:.72rem; color:var(--muted); }
</style>
</head>

<script>
(function () {
  const gd = document.getElementsByClassName('plotly-graph-div')[0];
  const SPECIES = [{"name": "Parus major", "n": 50}, {"name": "Parus minor", "n": 29}, {"name": "Parus bokharensis", "n": 7}, {"name": "Parus cinereus", "n": 3}], SEXES = [{"name": "Male", "n": 62, "color": "#3498db"}, {"name": "Female", "n": 27, "color": "#e74c3c"}];
  let sp = 'all';
  const sexOn = {};  SEXES.forEach(s => sexOn[s.name] = true);
  const total = SPECIES.reduce((a, s) => a + s.n, 0);

  /* species pills */
  const pills = document.getElementById('pmSpecies');
  [{ name: 'all', label: 'All species', n: total }].concat(SPECIES.map(s => ({ name: s.name, label: s.name, n: s.n }))).forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'pm-pill' + (i === 0 ? ' active' : '');
    const t = document.createElement(s.name === 'all' ? 'span' : 'i'); t.textContent = s.label;
    const c = document.createElement('small'); c.textContent = s.n;
    b.append(t, c);
    b.onclick = () => { sp = s.name; pills.querySelectorAll('.pm-pill').forEach(x => x.classList.toggle('active', x === b)); apply(); };
    pills.appendChild(b);
  });

  /* sex chips */
  const sexBox = document.getElementById('pmSex');
  SEXES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pm-chip'; b.style.setProperty('--c', s.color);
    b.title = 'Click to show / hide';
    const d = document.createElement('span'); d.className = 'dot';
    const t = document.createElement('span'); t.textContent = s.name;
    const c = document.createElement('small'); c.textContent = s.n;
    b.append(d, t, c);
    b.onclick = () => { sexOn[s.name] = !sexOn[s.name]; b.classList.toggle('off', !sexOn[s.name]); apply(); };
    sexBox.appendChild(b);
  });

  /* apply filters + live counts */
  function apply() {
    const vis = gd.data.map(t => { const m = t.meta || {}; return (sp === 'all' || m.species === sp) && sexOn[m.sex] !== false; });
    Plotly.restyle(gd, { visible: vis });
    let n = 0; const locs = new Set();
    gd.data.forEach((t, i) => { if (vis[i]) { n += t.meta.n; t.meta.locs.forEach(l => locs.add(l)); } });
    document.getElementById('pmStatus').innerHTML = 'Showing <b>' + n + '</b> samples at <b>' + locs.size + '</b> locations';
  }

  /* dark mode: follow the website's button (same origin), else the OS setting */
  function parentDark() {
    try { return window.parent !== window && window.parent.document.body.classList.contains('dark-mode'); } catch (e) { return null; }
  }
  function theme() {
    const p = parentDark();
    const dark = p === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : p;
    if (document.body.classList.contains('dark') === dark && theme.done) return;
    theme.done = true;
    document.body.classList.toggle('dark', dark);
    Plotly.relayout(gd, dark
      ? { 'geo.landcolor': '#1e293b', 'geo.oceancolor': '#0f172a', 'geo.countrycolor': '#334155', 'geo.coastlinecolor': '#475569' }
      : { 'geo.landcolor': '#f9f9f9', 'geo.oceancolor': '#eef7ff', 'geo.countrycolor': '#d1d1d1', 'geo.coastlinecolor': '#d1d1d1' });
  }
  try { if (window.parent !== window) new MutationObserver(theme).observe(window.parent.document.body, { attributes: true, attributeFilter: ['class'] }); }
  catch (e) { setInterval(theme, 1500); }

  /* click on a bubble -> open its samples in the table of the main page */
  function bindClick() {
    gd.on('plotly_click', function (data) {
      const point = data.points[0];
      if (!point) return;
      const url = point.customdata[0];
      if (!url) return;
      if (window.parent && window.parent.switchToTable) window.parent.switchToTable(url);
      else window.open(url, '_blank');
    });
  }

  let tries = 0;
  (function init() {
    if (gd.data && gd.data.length && gd.on) { apply(); theme(); bindClick(); }
    else if (tries++ < 100) setTimeout(init, 100);
  })();
})();
</script>
